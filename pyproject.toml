[project]
name = "IonNLG"
version = "0.1.0"
description = "Experimental data and scripts to support manuscript"
readme = "README.md"
authors = [
    { name = "Jim Furches", email = "james.furches@pnnl.gov" }
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.7.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "pydantic>=2.12.5",
    "pytz>=2026.1.post1",
    "qiskit-ibm-runtime>=0.45.1",
    "seaborn>=0.13.2",
]

[project.scripts]
import-data = "IonNLG.import_data:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
